<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bisk-8" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Bisk-8</title>
  <defs>
    <mask id="bite">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="400" cy="112" r="52" fill="#000"/>
      <circle cx="346" cy="100" r="26" fill="#000"/>
      <circle cx="412" cy="168" r="26" fill="#000"/>
    </mask>
    <linearGradient id="biscuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d27e"/>
      <stop offset="1" stop-color="#d18f35"/>
    </linearGradient>
  </defs>

  <!-- pinos -->
  <g fill="#c9cdd6" stroke="#7b8291" stroke-width="3">
    <rect x="124" y="46" width="32" height="58" rx="8"/>
    <rect x="194" y="46" width="32" height="58" rx="8"/>
    <rect x="264" y="46" width="32" height="58" rx="8"/>

    <rect x="124" y="408" width="32" height="58" rx="8"/>
    <rect x="194" y="408" width="32" height="58" rx="8"/>
    <rect x="264" y="408" width="32" height="58" rx="8"/>
    <rect x="334" y="408" width="32" height="58" rx="8"/>

    <rect x="46" y="124" width="58" height="32" rx="8"/>
    <rect x="46" y="194" width="58" height="32" rx="8"/>
    <rect x="46" y="264" width="58" height="32" rx="8"/>
    <rect x="46" y="334" width="58" height="32" rx="8"/>

    <rect x="408" y="264" width="58" height="32" rx="8"/>
    <rect x="408" y="334" width="58" height="32" rx="8"/>
  </g>

  <!-- corpo do chip (biscoito com mordida) -->
  <rect x="96" y="96" width="320" height="320" rx="40" fill="url(#biscuit)" stroke="#8a5516" stroke-width="10" mask="url(#bite)"/>

  <!-- 8 bits como furos de bolacha Maria: 1101 / 0101 (1 = claro, 0 = escuro) -->
  <g>
    <circle cx="160" cy="214" r="28" fill="#a8741f"/>
    <circle cx="224" cy="214" r="28" fill="#a8741f"/>
    <circle cx="288" cy="214" r="28" fill="#2e1a06"/>
    <circle cx="352" cy="214" r="28" fill="#a8741f"/>
    <circle cx="160" cy="298" r="28" fill="#2e1a06"/>
    <circle cx="224" cy="298" r="28" fill="#a8741f"/>
    <circle cx="288" cy="298" r="28" fill="#2e1a06"/>
    <circle cx="352" cy="298" r="28" fill="#a8741f"/>
  </g>
</svg>
